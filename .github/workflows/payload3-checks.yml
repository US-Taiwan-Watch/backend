name: Payload 3 source checks
on:
  pull_request:
    paths: ['payload3/**', '.github/workflows/payload3-checks.yml']
  push:
    branches: [master]
    paths: ['payload3/**', '.github/workflows/payload3-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: payload3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: payload3/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          USTW_BUILD_ONLY: '1'
          AZURE_STORAGE_ACCOUNT_BASEURL: https://ustwcmsstorage.blob.core.windows.net
          NEXT_TELEMETRY_DISABLED: '1'
          PAYLOAD_TELEMETRY_DISABLED: 'true'
          NODE_OPTIONS: --max-old-space-size=3072
